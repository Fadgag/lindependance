name: CI

on:
  pull_request:
    branches:
      - main
      - preprod
  push:
    branches:
      - main
      - preprod

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            git diff --name-only -z "$BASE_SHA"...HEAD -- \
              '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts'
          )

          if ((${#files[@]} == 0)); then
            echo "No JavaScript or TypeScript files changed; skipping ESLint."
          else
            pnpm exec eslint "${files[@]}"
          fi

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build
        env:
          NEXTAUTH_SECRET: ci-only-not-a-real-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  migrate:
    name: Apply Prisma migrations
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'preprod' }}
    concurrency:
      group: prisma-migrate-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check migrations are additive and schema-only
        run: node scripts/check-additive-migrations.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
