name: Main promotion source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  source-policy:
    name: Only preprod may target main
    runs-on: ubuntu-latest
    steps:
      - name: Require the same-repository preprod branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" != "preprod" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::Only a pull request from this repository's preprod branch may target main."
            exit 1
          fi

          echo "The pull request source is the repository's preprod branch."
